<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Coast Stream Package</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&family=Rajdhani:wght@500;700&display=swap">
<style>
  body { margin: 0; background: #12051f; color: #fff3e0; font-family: Rajdhani, sans-serif; padding: 40px 16px; }
  h1 { font-family: Anton, sans-serif; font-size: 64px; letter-spacing: 4px; margin: 0; text-align: center;
       background: linear-gradient(180deg, #ffd23f, #ff8a3d, #ff2d95); -webkit-background-clip: text; color: transparent; }
  .sub { text-align: center; font-family: Pacifico, cursive; color: #ff6ec7; font-size: 28px; margin: 4px 0 30px;
         text-shadow: 0 0 12px #ff2d95; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); gap: 28px; max-width: 1700px; margin: 0 auto; }
  .card { background: #1d0a33; border: 2px solid #ff6ec755; border-radius: 6px; overflow: hidden; }
  .frame { position: relative; aspect-ratio: 16/9; background: repeating-conic-gradient(#222 0 25%, #333 0 50%) 0 0/24px 24px; }
  .frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .meta { padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .meta b { font-family: Anton, sans-serif; letter-spacing: 2px; font-size: 22px; }
  .meta a { color: #2de2e6; font-weight: 700; text-decoration: none; letter-spacing: 1px; }
</style>
</head>
<body>
  <h1>NEON COAST</h1>
  <div class="sub">animated stream package</div>
  <p id="fontStatus" style="text-align:center;font-weight:700;letter-spacing:1px;margin:-14px 0 28px">Checking GTA font…</p>
  <div class="grid">
    <div class="card"><div class="frame"><iframe src="screens/starting.html"></iframe></div><div class="meta"><b>STARTING SOON</b><a href="screens/starting.html" target="_blank">open ↗</a></div></div>
    <div class="card"><div class="frame"><iframe src="screens/brb.html"></iframe></div><div class="meta"><b>BE RIGHT BACK</b><a href="screens/brb.html" target="_blank">open ↗</a></div></div>
    <div class="card"><div class="frame"><iframe src="screens/ending.html"></iframe></div><div class="meta"><b>STREAM ENDING</b><a href="screens/ending.html" target="_blank">open ↗</a></div></div>
    <div class="card"><div class="frame"><iframe src="screens/offline.html"></iframe></div><div class="meta"><b>OFFLINE</b><a href="screens/offline.html" target="_blank">open ↗</a></div></div>
    <div class="card"><div class="frame"><iframe src="screens/wasted.html"></iframe></div><div class="meta"><b>WASTED / BUSTED</b><a href="screens/wasted.html" target="_blank">open ↗</a></div></div>
    <div class="card"><div class="frame"><iframe src="overlays/just-chatting.html"></iframe></div><div class="meta"><b>JUST CHATTING</b><a href="overlays/just-chatting.html" target="_blank">open ↗</a></div></div>
    <div class="card"><div class="frame"><iframe src="overlays/gameplay.html"></iframe></div><div class="meta"><b>GAMEPLAY OVERLAY (transparent)</b><a href="overlays/gameplay.html" target="_blank">open ↗</a></div></div>
  </div>
<script>
  // Same font sources as assets/css/theme.css, so this reports what the scenes will get.
  (function () {
    const el = document.getElementById("fontStatus");
    const srcs = ['local("Pricedown")', 'local("Pricedown Bl")', 'local("Pricedown Black")', 'local("PricedownBl-Regular")',
      'url("assets/fonts/pricedown.woff2")', 'url("assets/fonts/pricedown.woff")', 'url("assets/fonts/pricedown.otf")',
      'url("assets/fonts/pricedown.ttf")', 'url("assets/fonts/pricedown bl.otf")', 'url("assets/fonts/pricedown bl.ttf")'];
    new FontFace("GTA Pricedown Check", srcs.join(", ")).load().then(function (f) {
      document.fonts.add(f);
      el.textContent = "GTA font (Pricedown) loaded ✔";
      el.style.cssText += ";color:#7dff8c;font-family:'GTA Pricedown Check';font-size:34px;font-weight:400";
    }).catch(function () {
      el.innerHTML = "GTA font not found, using fallback. See <a style='color:#2de2e6' href='assets/fonts/README.md'>assets/fonts/README.md</a>";
      el.style.color = "#ffd23f";
    });
  })();
</script>
</body>
</html>
