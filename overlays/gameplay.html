<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gameplay Overlay</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<script src="../assets/js/config.js"></script>
<script src="../assets/js/scene.js"></script>
</head>
<!-- Transparent overlay: put this ABOVE your game capture in OBS. -->
<body class="transparent">
  <div class="stage">
    <div class="content">
      <!-- webcam frame: place your camera source at x=50 y=50, 480x270 -->
      <div class="cam" style="left:50px;top:50px;width:480px;height:270px">
        <div class="cam-tag" style="top:auto;bottom:-24px" data-bind="name">YOUR NAME</div>
        <div class="rec">LIVE</div>
      </div>
      <div class="hud">
        <div class="time" data-clock>00:00</div>
        <div class="money">$<span data-goal>0 / 0</span><div class="cash-pop">+ $500</div></div>
        <div data-wanted></div>
      </div>
      <div class="radar-wrap">
        <div class="radar"><div class="radar-map"></div><div class="blip y"></div><div class="blip p"></div><div class="blip c"></div>
          <div class="me"></div><div class="compass">N</div><div class="cop-edge"></div></div>
        <div class="vitals"><div class="hp"><i></i></div><div class="ar"><i></i></div></div>
      </div>
      <div class="radio panel" style="bottom:50px;width:430px"><div class="disc"></div><div class="meta"><div class="station" data-bind="station">NEON FM</div><div class="song" data-bind="song">Song</div><div class="eq" data-eq></div></div></div>
    </div>
  </div>
</body>
</html>
