<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be Right Back</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<script src="../assets/js/config.js"></script>
<script src="../assets/js/scene.js"></script>
</head>
<body>
  <div class="stage">
    <div class="scene" data-scene></div>
    <div class="content">
      <div class="badge panel"><span class="dot"></span><div><div class="name" data-bind="name">YOUR NAME</div><div class="sub" data-bind="tagline">Live</div></div></div>
      <div class="hud"><div class="time" data-clock>00:00</div><div data-wanted="2"></div></div>
      <div class="center-stack" style="top:170px">
        <div class="script teal" style="font-size:92px">Pit stop</div>
        <div class="block" data-split style="font-size:190px;margin-top:-10px">BE RIGHT BACK</div>
      </div>
      <div class="center-stack" style="top:560px;gap:22px">
        <div class="tip in" style="font-size:36px">Stay in the car. Don't touch the radio.</div>
        <div class="loadbar indeterminate" style="width:620px"><div class="fill"></div></div>
      </div>
      <div class="radio panel" style="left:60px;right:auto;animation-name:slideInL"><div class="disc"></div><div class="meta"><div class="station" data-bind="station">NEON FM</div><div class="song" data-bind="song">Song</div><div class="eq" data-eq></div></div></div>
      <div class="phone" data-phone style="right:70px;top:370px"></div>
      <div class="mission-sub" data-mission="missionBrb"></div>
      <div class="ticker"><div class="tag">FOLLOW</div><div class="ticker-track"></div></div>
    </div>
    <div class="wipe"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
