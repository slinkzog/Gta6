<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starting Soon</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<script src="../assets/js/config.js"></script>
<script src="../assets/js/scene.js"></script>
</head>
<body>
  <div class="stage">
    <div class="scene" data-scene></div>
    <div class="content">
      <div class="badge panel"><span class="dot"></span><div><div class="name" data-bind="name">YOUR NAME</div><div class="sub" data-bind="tagline">Live</div></div></div>
      <div class="hud"><div class="time" data-clock>00:00</div><div data-wanted="auto"></div></div>
      <div class="center-stack" style="top:150px">
        <div class="script" style="font-size:96px">Stream</div>
        <div class="block" data-split style="font-size:210px;margin-top:-20px">STARTING SOON</div>
      </div>
      <div class="center-stack" style="top:560px;gap:18px">
        <div class="label">Rolling out in</div>
        <div class="timer" data-countdown>05:00</div>
        <div class="loadbar"><div class="fill" data-progress></div></div>
        <div class="tip" data-tips></div>
      </div>
      <div class="radio panel"><div class="disc"></div><div class="meta"><div class="station" data-bind="station">NEON FM</div><div class="song" data-bind="song">Song</div><div class="eq" data-eq></div></div></div>
      <div class="mission-sub" data-mission="missionStart"></div>
      <div class="ticker"><div class="tag">FOLLOW</div><div class="ticker-track"></div></div>
    </div>
    <div class="wipe"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
