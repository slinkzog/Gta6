<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline</title>
<link rel="stylesheet" href="../assets/css/theme.css">
<script src="../assets/js/config.js"></script>
<script src="../assets/js/scene.js"></script>
</head>
<body>
  <div class="stage">
    <div class="scene" data-scene data-road="true"></div>
    <div class="content">
      <div class="badge panel"><span class="dot" style="background:#777;box-shadow:none;animation:none"></span><div><div class="name" data-bind="name">YOUR NAME</div><div class="sub">Currently offline</div></div></div>
      <div class="center-stack" style="top:180px;right:200px">
        <div class="script teal" style="font-size:96px">Out in the city</div>
        <div class="block" data-split data-fit="1250" style="font-size:250px;margin-top:-10px">OFFLINE</div>
      </div>
      <div class="center-stack" style="top:640px;right:200px">
        <div class="panel" style="padding:22px 50px;animation:slideUp .8s both 1.2s">
          <div class="label" style="text-align:center">Catch the next stream</div>
          <div class="block" data-fit="680" style="font-size:64px;color:#fff;letter-spacing:4px" data-bind="schedule">SCHEDULE</div>
        </div>
      </div>
      <div class="phone" data-phone style="right:70px;top:300px"></div>
      <div class="ticker"><div class="tag">FOLLOW</div><div class="ticker-track"></div></div>
    </div>
    <div class="wipe"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
</html>
