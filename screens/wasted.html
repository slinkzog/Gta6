<!doctype html>
<html lang="en">
<head>

<title>Wasted</title>

<!-- Technical-difficulties screen. Add ?wastedText=BUSTED for the other one. -->
<body class="wasted-scene">
  <div class="stage">
    <div class="scene" data-scene></div>
    <div class="content letterbox">
      <div class="wasted-band"></div>
      <div class="center-stack" style="top:410px;gap:28px">
        <div class="wasted-word" data-bind="wastedText">WASTED</div>
        <div class="respawn">Respawning</div>
      </div>
      <div class="mission-sub" data-mission="missionWasted" style="bottom:150px;width:1200px;animation:fadeIn 1s both 3.2s"></div>
    </div>
    <div class="wipe"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
</body>
